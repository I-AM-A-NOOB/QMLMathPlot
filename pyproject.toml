[project]
name = "qmlmathplot"
version = "0.1.0"
description = "可嵌入 Qt Quick App 的函数绘图组件（隐式逐像素绘制，MVVM）"
readme = "README.md"
authors = [
    { name = "I-AM-A-NOOB", email = "suzc08@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "sympy>=1.14",
    "PySide6>=6.7",
]

[project.scripts]
qmlmathplot = "qmlmathplot.app:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gui: 需要真实 GPU 场景图（会开窗渲染）",
]
