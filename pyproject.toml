[project]
name = "qmlmathplot"
version = "0.1.0"
description = "Embeddable function plotter for Qt Quick / QtWidgets (implicit per-pixel drawing, MVVM)"
readme = "README.md"
authors = [
    { name = "I-AM-A-NOOB", email = "suzc08@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "sympy>=1.14",
    "PySide6>=6.7",
]

[project.optional-dependencies]
# The matplotlib hand-off (Plot.to_matplotlib / savefig(backend="matplotlib")) is optional:
# nothing in the package imports matplotlib until that path is used.
matplotlib = ["matplotlib>=3.8"]

[project.scripts]
qmlmathplot = "qmlmathplot.app:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "matplotlib>=3.8",      # the hand-off tests need it (the feature itself stays optional)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gui: needs a real GPU scene graph (opens windows and renders)",
]
